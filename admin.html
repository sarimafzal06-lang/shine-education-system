<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login - The Shine Education System</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #123c69, #1d5d91);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            width: 400px;
            max-width: 100%;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.25);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-icon {
            width: 70px;
            height: 70px;
            background: #123c69;
            color: white;
            border-radius: 50%;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        .logo h1 {
            color: #123c69;
            font-size: 21px;
            margin-top: 15px;
        }

        .logo p {
            color: #777;
            margin-top: 5px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #123c69;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0d2f52;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            color: red;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: #123c69;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="login-box">

    <div class="logo">

        <div class="logo-icon">
            TS
        </div>

        <h1>The Shine Education System</h1>

        <p>Campus 2</p>

    </div>


    <h2>🔐 Admin Login</h2>


    <form onsubmit="login(event)">

        <div class="input-group">

            <label>Username</label>

            <input
                type="text"
                id="username"
                placeholder="Enter username"
                required
            >

        </div>


        <div class="input-group">

            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >

        </div>


        <button type="submit">
            Login to Admin Panel
        </button>

    </form>


    <div id="message"></div>


    <div class="back">

        <a href="index.html">
            ← Back to School Website
        </a>

    </div>

</div>


<script>

function login(event) {

    event.preventDefault();

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;


    if (
        username === "admin" &&
        password === "12345"
    ) {

        alert("Login successful!");

        window.location.href = "dashboard.html";

    } else {

        document.getElementById("message").innerText =
            "Wrong username or password.";

    }

}

</script>

</body>

</html>
