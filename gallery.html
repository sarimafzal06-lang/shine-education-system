<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Gallery - The Shine Education System</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
        }

        header {
            background: #123c69;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            font-size: 28px;
        }

        header p {
            margin-top: 5px;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .title {
            text-align: center;
            color: #123c69;
            margin-bottom: 30px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .photo {
            height: 220px;
            background: #dbeafe;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
        }

        .photo p {
            font-size: 16px;
            margin-top: 100px;
        }

        .back {
            text-align: center;
            margin-top: 35px;
        }

        .back a {
            color: #123c69;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 700px) {

            .gallery {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

<header>

    <h1>The Shine Education System</h1>

    <p>Campus 2</p>

</header>


<div class="container">

    <h2 class="title">🖼️ School Gallery</h2>


    <div class="gallery">

        <div class="photo">
            🏫
        </div>

        <div class="photo">
            🎓
        </div>

        <div class="photo">
            📚
        </div>

        <div class="photo">
            ⚽
        </div>

        <div class="photo">
            🏆
        </div>

        <div class="photo">
            👨‍🎓
        </div>

    </div>


    <div class="back">

        <a href="index.html">
            ← Back to School Website
        </a>

    </div>

</div>

</body>

</html>
