</div>

<script>

async function loadAdmissions() {

    const list =
        document.getElementById("admissionsList");

    try {

        const response =
            await fetch("/api/data");

        if (!response.ok) {
            throw new Error("Database load failed");
        }

        const data =
            await response.json();

        const admissions =
            Array.isArray(data.admissions)
                ? data.admissions
                : [];

        if (admissions.length === 0) {

            list.innerHTML =
                '<div class="empty">No admission requests found.</div>';

            return;
        }

        list.innerHTML = "";

        admissions
            .slice()
            .reverse()
            .forEach(admission => {

                const div =
                    document.createElement("div");

                div.className =
                    "admission";

                div.innerHTML = `
                    <h3>👨‍🎓 ${admission.studentName || "-"}</h3>

                    <p>
                        <strong>Father Name:</strong>
                        ${admission.fatherName || "-"}
                    </p>

                    <p>
                        <strong>Class:</strong>
                        ${admission.className || "-"}
                    </p>

                    <p>
                        <strong>Phone:</strong>
                        ${admission.phone || "-"}
                    </p>

                    <p>
                        <strong>Address:</strong>
                        ${admission.address || "-"}
                    </p>

                    <p>
                        <strong>Date:</strong>
                        ${admission.date || "-"}
                    </p>
<span class="status">
    ${admission.status || "Pending"}
</span>

${
    (admission.status || "Pending") === "Pending"
    ? `
        <div style="margin-top:15px; display:flex; gap:10px;">

            <button
                onclick="updateAdmissionStatus(${admission.id}, 'Approved')"
                style="
                    background:#198754;
                    color:white;
                    border:none;
                    padding:10px 18px;
                    border-radius:6px;
                    cursor:pointer;
                    font-weight:bold;
                "
            >
                ✅ Approve
            </button>

            <button
                onclick="updateAdmissionStatus(${admission.id}, 'Rejected')"
                style="
                    background:#d62828;
                    color:white;
                    border:none;
                    padding:10px 18px;
                    border-radius:6px;
                    cursor:pointer;
                    font-weight:bold;
                "
            >
                ❌ Reject
            </button>

        </div>
    `
    : ""
}
                     
                       
                `;

                list.appendChild(div);

            });

    } catch (error) {

        list.innerHTML =
            '<div class="error">❌ Admissions load nahi ho rahi.</div>';

        console.error(error);

    }

}

loadAdmissions();
async function updateAdmissionStatus(id, status) {

    try {

        const response =
            await fetch(
                "/api/admissions/" + id,
                {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        status: status
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok || !data.success) {

            alert(
                data.message ||
                "Status update nahi hua."
            );

            return;
        }

        if (status === "Approved") {

            alert(
                "✅ Admission Approved!\n\n" +
                "Student ko school branch visit karna hai."
            );

        } else {

            alert(
                "❌ Admission Rejected."
            );

        }

        loadAdmissions();

    } catch (error) {

        console.error(error);

        alert(
            "❌ Server connection error."
        );

    }

}
</script>
