<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Teachers - The Shine Education System</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f7fb;
}

header {
    background: #123c69;
    color: white;
    padding: 25px;
    text-align: center;
}

header h1 {
    font-size: 28px;
}

header p {
    margin-top: 6px;
}

.container {
    max-width: 1100px;
    margin: 40px auto;
    padding: 20px;
}

.title {
    color: #123c69;
    margin-bottom: 25px;
}

.form-box {
    background: white;
    padding: 25px;
    border-radius: 10px;
    margin-bottom: 30px;
    box-shadow: 0 4px 15px #00000012;
}

.form-box h2 {
    color: #123c69;
    margin-bottom: 20px;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

input,
select {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 15px;
}

button {
    margin-top: 18px;
    padding: 13px 20px;
    background: #123c69;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.table-box {
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 4px 15px #00000012;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    padding: 14px;
    border-bottom: 1px solid #ddd;
    text-align: left;
}

th {
    background: #123c69;
    color: white;
}

.delete-btn {
    background: #d62828;
    margin: 0;
    padding: 8px 12px;
}

.message {
    margin-top: 15px;
    font-weight: bold;
}

.back {
    text-align: center;
    margin-top: 30px;
}

.back a {
    color: #123c69;
    text-decoration: none;
    font-weight: bold;
}

@media (max-width: 700px) {

    .form-grid {
        grid-template-columns: 1fr;
    }

}

</style>

</head>

<body>

<header>

<h1>The Shine Education System</h1>

<p>Campus 2</p>

</header>


<div class="container">

<h2 class="title">👩‍🏫 Teacher Management</h2>


<div class="form-box">

<h2>➕ Add New Teacher</h2>

<form onsubmit="addTeacher(event)">

<div class="form-grid">

<input
type="text"
id="teacherName"
placeholder="Teacher Name"
required
>

<input
type="text"
id="subject"
placeholder="Subject"
required
>

<input
type="text"
id="phone"
placeholder="Phone Number"
required
>

<input
type="text"
id="qualification"
placeholder="Qualification"
required
>

</div>

<button type="submit">
💾 Save Teacher
</button>

</form>

<div id="message"
class="message">
</div>

</div>


<div class="table-box">

<h2 class="title">
📋 Teacher Records
</h2>

<table>

<thead>

<tr>

<th>Name</th>
<th>Subject</th>
<th>Phone</th>
<th>Qualification</th>
<th>Action</th>

</tr>

</thead>

<tbody id="teacherTable">
</tbody>

</table>

</div>


<div class="back">

<a href="dashboard.html">
← Back to Dashboard
</a>

</div>

</div>


<script>

async function loadTeachers() {

    const response =
        await fetch("/api/data");

    const data =
        await response.json();

    const table =
        document.getElementById(
            "teacherTable"
        );

    table.innerHTML = "";


    data.teachers.forEach(
        (teacher, index) => {

        const row =
            document.createElement("tr");

        row.innerHTML = `

            <td>${teacher.teacherName}</td>

            <td>${teacher.subject}</td>

            <td>${teacher.phone}</td>

            <td>${teacher.qualification}</td>

            <td>

                <button
                    class="delete-btn"
                    onclick="deleteTeacher(${index})">

                    Delete

                </button>

            </td>

        `;

        table.appendChild(row);

    });

}


async function addTeacher(event) {

    event.preventDefault();


    const teacher = {

        teacherName:
            document.getElementById(
                "teacherName"
            ).value.trim(),

        subject:
            document.getElementById(
                "subject"
            ).value.trim(),

        phone:
            document.getElementById(
                "phone"
            ).value.trim(),

        qualification:
            document.getElementById(
                "qualification"
            ).value.trim()

    };


    const response =
        await fetch("/api/teachers", {

            method: "POST",

            headers: {
                "Content-Type":
                    "application/json"
            },

            body:
                JSON.stringify(teacher)

        });


    const result =
        await response.json();


    if (result.success) {

        document.getElementById(
            "message"
        ).innerText =
            "✅ Teacher saved successfully!";

        document.querySelector(
            "form"
        ).reset();

        loadTeachers();

    } else {

        document.getElementById(
            "message"
        ).innerText =
            "❌ Teacher save nahi hua.";

    }

}


async function deleteTeacher(index) {

    if (
        !confirm(
            "Delete this teacher?"
        )
    ) {
        return;
    }


    await fetch(
        "/api/teachers/" + index,
        {
            method: "DELETE"
        }
    );


    loadTeachers();

}


loadTeachers();

</script>

</body>

</html>
