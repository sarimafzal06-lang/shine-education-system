<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Students - The Shine Education System</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f7fb;
}

header {
    background: #123c69;
    color: white;
    padding: 25px;
    text-align: center;
}

header h1 {
    font-size: 28px;
}

header p {
    margin-top: 6px;
}

.container {
    max-width: 1100px;
    margin: 40px auto;
    padding: 20px;
}

.title {
    color: #123c69;
    margin-bottom: 25px;
}

.form-box {
    background: white;
    padding: 25px;
    border-radius: 10px;
    margin-bottom: 30px;
    box-shadow: 0 4px 15px #00000012;
}

.form-box h2 {
    color: #123c69;
    margin-bottom: 20px;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

input,
select {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 15px;
}

button {
    margin-top: 18px;
    padding: 13px 20px;
    background: #123c69;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #0d2f52;
}

.table-box {
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 4px 15px #00000012;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    padding: 14px;
    border-bottom: 1px solid #ddd;
    text-align: left;
}

th {
    background: #123c69;
    color: white;
}

.delete-btn {
    background: #d62828;
    margin: 0;
    padding: 8px 12px;
}

.message {
    margin-top: 15px;
    font-weight: bold;
}

.back {
    text-align: center;
    margin-top: 30px;
}

.back a {
    color: #123c69;
    text-decoration: none;
    font-weight: bold;
}

@media (max-width: 700px) {

    .form-grid {
        grid-template-columns: 1fr;
    }

}

</style>

</head>

<body>


<header>

<h1>The Shine Education System</h1>

<p>Campus 2</p>

</header>


<div class="container">

<h2 class="title">👨‍🎓 Student Management</h2>


<div class="form-box">

<h2>➕ Add New Student</h2>


<form onsubmit="addStudent(event)">

<div class="form-grid">

<input
type="text"
id="rollNo"
placeholder="Roll Number"
required
>

<input
type="text"
id="studentName"
placeholder="Student Name"
required
>

<input
type="text"
id="fatherName"
placeholder="Father Name"
required
>

<select id="className" required>

<option value="">
Select Class
</option>

<option>Play Group</option>
<option>Nursery</option>
<option>Prep</option>
<option>1st</option>
<option>2nd</option>
<option>3rd</option>
<option>4th</option>
<option>5th</option>
<option>6th</option>
<option>7th</option>
<option>8th</option>
<option>9th</option>
<option>10th</option>

</select>

<input
type="text"
id="phone"
placeholder="Phone Number"
required
>

</div>


<button type="submit">
💾 Save Student
</button>

</form>


<div
id="message"
class="message">
</div>

</div>


<div class="table-box">

<h2 class="title">
📋 Student Records
</h2>


<table>

<thead>

<tr>

<th>Roll No</th>
<th>Student Name</th>
<th>Father Name</th>
<th>Class</th>
<th>Phone</th>
<th>Action</th>

</tr>

</thead>


<tbody id="studentTable">

</tbody>

</table>

</div>


<div class="back">

<a href="dashboard.html">
← Back to Dashboard
</a>

</div>

</div>


<script>

async function loadStudents() {

    const response =
        await fetch("/api/data");

    const data =
        await response.json();

    const table =
        document.getElementById(
            "studentTable"
        );

    table.innerHTML = "";


    data.students.forEach(
        (student, index) => {

        const row =
            document.createElement("tr");

        row.innerHTML = `

            <td>${student.rollNo}</td>

            <td>${student.studentName}</td>

            <td>${student.fatherName}</td>

            <td>${student.className}</td>

            <td>${student.phone}</td>

            <td>
                <button
                    class="delete-btn"
                    onclick="deleteStudent(${index})">
                    Delete
                </button>
            </td>

        `;

        table.appendChild(row);

    });

}


async function addStudent(event) {

    event.preventDefault();


    const student = {

        rollNo:
            document.getElementById(
                "rollNo"
            ).value.trim(),

        studentName:
            document.getElementById(
                "studentName"
            ).value.trim(),

        fatherName:
            document.getElementById(
                "fatherName"
            ).value.trim(),

        className:
            document.getElementById(
                "className"
            ).value,

        phone:
            document.getElementById(
                "phone"
            ).value.trim()

    };


    const response =
        await fetch("/api/students", {

            method: "POST",

            headers: {
                "Content-Type":
                    "application/json"
            },

            body:
                JSON.stringify(student)

        });


    const result =
        await response.json();


    if (result.success) {

        document.getElementById(
            "message"
        ).innerText =
            "✅ Student saved successfully!";

        document.querySelector(
            "form"
        ).reset();

        loadStudents();

    } else {

        document.getElementById(
            "message"
        ).innerText =
            "❌ Student save nahi hua.";

    }

}


async function deleteStudent(index) {

    if (
        !confirm(
            "Delete this student?"
        )
    ) {
        return;
    }


    await fetch(
        "/api/students/" + index,
        {
            method: "DELETE"
        }
    );


    loadStudents();

}


loadStudents();

</script>


</body>

</html>
